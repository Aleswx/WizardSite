<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard de Leads — Quiz de Inglês</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --red:#e2001a; --black:#1a1a1a; --white:#fff; --grey-bg:#f4f4f5;
    --muted:#6e6e76; --track:#e6e6e9;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--grey-bg); color:var(--black); padding:24px;
  }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 24px; }

  .gate{ max-width:360px; margin: 80px auto; background:#fff; padding:28px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  .gate input{ width:100%; padding:12px; border:1.5px solid var(--track); border-radius:8px; margin:12px 0; font-size:14px; }
  .gate button, .btn{ width:100%; padding:12px; border:none; border-radius:8px; background:var(--red); color:#fff; font-weight:700; cursor:pointer; font-size:14px; }

  .hidden{ display:none; }

  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
  .stat-card{ background:#fff; border-radius:12px; padding:18px; box-shadow:0 4px 14px rgba(0,0,0,.05); }
  .stat-card .n{ font-size:26px; font-weight:800; }
  .stat-card .l{ font-size:13px; color:var(--muted); }

  .charts{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:24px; }
  @media (max-width: 760px){ .charts{ grid-template-columns:1fr; } }
  .chart-card{ background:#fff; border-radius:12px; padding:18px; box-shadow:0 4px 14px rgba(0,0,0,.05); }
  .chart-card h3{ font-size:14px; margin:0 0 12px; color:var(--muted); }

  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.05); }
  th,td{ text-align:left; padding:12px 14px; font-size:13.5px; border-bottom:1px solid var(--track); }
  th{ background:var(--grey-bg); color:var(--muted); font-weight:600; }
  tr:last-child td{ border-bottom:none; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .toolbar button{ background:none; border:1px solid var(--track); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>

  <div class="gate" id="gate">
    <h1>Dashboard de Leads</h1>
    <p class="sub">Digite a chave de acesso (DASHBOARD_API_KEY) configurada no servidor.</p>
    <input id="api-base" type="text" placeholder="URL da API (ex: https://seu-backend.up.railway.app)" />
    <input id="api-key" type="password" placeholder="Chave de acesso" />
    <button onclick="unlock()">Entrar</button>
    <p id="gate-error" style="color:var(--red); font-size:13px; margin-top:10px;"></p>
  </div>

  <div id="app" class="hidden">
    <div class="toolbar">
      <div>
        <h1>Dashboard de Leads</h1>
        <p class="sub">Quiz de nível de inglês</p>
      </div>
      <button onclick="refresh()">Atualizar</button>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="n" id="stat-total">-</div><div class="l">Leads totais</div></div>
      <div class="stat-card"><div class="n" id="stat-avg">-</div><div class="l">Pontuação média (/14)</div></div>
      <div class="stat-card"><div class="n" id="stat-today">-</div><div class="l">Leads hoje</div></div>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h3>Leads por nível</h3>
        <canvas id="chart-tier"></canvas>
      </div>
      <div class="chart-card">
        <h3>Leads ao longo do tempo</h3>
        <canvas id="chart-time"></canvas>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Nível</th><th>Pontuação</th><th>Data</th></tr>
      </thead>
      <tbody id="leads-body"></tbody>
    </table>
  </div>

<script>
  let API_BASE = "";
  let API_KEY = "";
  let tierChart, timeChart;

  window.addEventListener("DOMContentLoaded", () => {
    const savedBase = sessionStorage.getItem("dash_api_base");
    const savedKey = sessionStorage.getItem("dash_api_key");
    if (savedBase && savedKey) {
      document.getElementById("api-base").value = savedBase;
      document.getElementById("api-key").value = savedKey;
      unlock();
    }
  });

  async function unlock(){
    API_BASE = document.getElementById("api-base").value.trim().replace(/\/$/, "");
    API_KEY = document.getElementById("api-key").value.trim();
    const errEl = document.getElementById("gate-error");
    errEl.textContent = "";

    try {
      const res = await fetch(API_BASE + "/api/stats", { headers: { "x-api-key": API_KEY } });
      if (!res.ok) throw new Error("unauthorized");
      sessionStorage.setItem("dash_api_base", API_BASE);
      sessionStorage.setItem("dash_api_key", API_KEY);
      document.getElementById("gate").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      refresh();
    } catch (e) {
      errEl.textContent = "Não foi possível conectar. Confira a URL e a chave de acesso.";
    }
  }

  async function refresh(){
    const [stats, leads] = await Promise.all([
      fetch(API_BASE + "/api/stats", { headers: { "x-api-key": API_KEY } }).then(r => r.json()),
      fetch(API_BASE + "/api/leads", { headers: { "x-api-key": API_KEY } }).then(r => r.json()),
    ]);

    document.getElementById("stat-total").textContent = stats.total;
    document.getElementById("stat-avg").textContent = stats.avgScore.toFixed(1);
    const today = new Date().toISOString().slice(0, 10);
    const todayRow = stats.byDay.find(d => d.day === today);
    document.getElementById("stat-today").textContent = todayRow ? todayRow.n : 0;

    renderTierChart(stats.byTier);
    renderTimeChart(stats.byDay);
    renderTable(leads);
  }

  function renderTierChart(byTier){
    const ctx = document.getElementById("chart-tier");
    const data = {
      labels: byTier.map(t => t.tier),
      datasets: [{ data: byTier.map(t => t.n), backgroundColor: ["#e2001a","#ff6b5c","#ffb199","#1a1a1a"] }],
    };
    if (tierChart) tierChart.destroy();
    tierChart = new Chart(ctx, { type: "doughnut", data, options: { plugins: { legend: { position: "bottom" } } } });
  }

  function renderTimeChart(byDay){
    const ctx = document.getElementById("chart-time");
    const data = {
      labels: byDay.map(d => d.day),
      datasets: [{ label: "Leads", data: byDay.map(d => d.n), borderColor: "#e2001a", backgroundColor: "rgba(226,0,26,.1)", fill: true, tension: .3 }],
    };
    if (timeChart) timeChart.destroy();
    timeChart = new Chart(ctx, { type: "line", data, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
  }

  function renderTable(leads){
    const body = document.getElementById("leads-body");
    body.innerHTML = "";
    leads.forEach(l => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(l.name)}</td>
        <td>${escapeHtml(l.email || "-")}</td>
        <td>${escapeHtml(l.phone || "-")}</td>
        <td>${escapeHtml(l.tier)}</td>
        <td>${l.score}/14</td>
        <td>${new Date(l.created_at).toLocaleString("pt-BR")}</td>
      `;
      body.appendChild(tr);
    });
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
